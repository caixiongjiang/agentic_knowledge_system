<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <!-- 自定义字体扫描目录 -->
  <dir>/usr/share/fonts/truetype/custom</dir>

  <!-- ================= 1. macOS 专属中文字体名称别名映射 ================= -->
  <!-- 苹方 (PingFang SC) -> 微软雅黑 / 思源黑体 -->
  <match target="pattern">
    <test qual="any" name="family"><string>PingFang SC</string></test>
    <edit name="family" mode="assign" binding="same"><string>Microsoft YaHei</string></edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family"><string>PingFang TC</string></test>
    <edit name="family" mode="assign" binding="same"><string>Microsoft JhengHei</string></edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family"><string>PingFang HK</string></test>
    <edit name="family" mode="assign" binding="same"><string>Microsoft JhengHei</string></edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family"><string>苹方</string></test>
    <edit name="family" mode="assign" binding="same"><string>Microsoft YaHei</string></edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family"><string>苹方-简</string></test>
    <edit name="family" mode="assign" binding="same"><string>Microsoft YaHei</string></edit>
  </match>

  <!-- 华文黑体 / 黑体-简 (Heiti SC / STHeiti) -> 黑体 / 思源黑体 -->
  <match target="pattern">
    <test qual="any" name="family"><string>Heiti SC</string></test>
    <edit name="family" mode="assign" binding="same"><string>SimHei</string></edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family"><string>STHeiti</string></test>
    <edit name="family" mode="assign" binding="same"><string>SimHei</string></edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family"><string>STHeiti Light</string></test>
    <edit name="family" mode="assign" binding="same"><string>SimHei</string></edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family"><string>STHeiti Medium</string></test>
    <edit name="family" mode="assign" binding="same"><string>SimHei</string></edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family"><string>华文黑体</string></test>
    <edit name="family" mode="assign" binding="same"><string>SimHei</string></edit>
  </match>

  <!-- 华文宋体 / 宋体-简 (Songti SC / STSong) -> 宋体 / 思源宋体 -->
  <match target="pattern">
    <test qual="any" name="family"><string>Songti SC</string></test>
    <edit name="family" mode="assign" binding="same"><string>SimSun</string></edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family"><string>STSong</string></test>
    <edit name="family" mode="assign" binding="same"><string>SimSun</string></edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family"><string>STSongti-SC-Regular</string></test>
    <edit name="family" mode="assign" binding="same"><string>SimSun</string></edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family"><string>华文宋体</string></test>
    <edit name="family" mode="assign" binding="same"><string>SimSun</string></edit>
  </match>

  <!-- 华文楷体 / 楷体-简 (Kaiti SC / STKaiti) -> 楷体 -->
  <match target="pattern">
    <test qual="any" name="family"><string>Kaiti SC</string></test>
    <edit name="family" mode="assign" binding="same"><string>KaiTi</string></edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family"><string>STKaiti</string></test>
    <edit name="family" mode="assign" binding="same"><string>KaiTi</string></edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family"><string>华文楷体</string></test>
    <edit name="family" mode="assign" binding="same"><string>KaiTi</string></edit>
  </match>

  <!-- 华文仿宋 (STFangsong) -> 仿宋 -->
  <match target="pattern">
    <test qual="any" name="family"><string>STFangsong</string></test>
    <edit name="family" mode="assign" binding="same"><string>FangSong</string></edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family"><string>华文仿宋</string></test>
    <edit name="family" mode="assign" binding="same"><string>FangSong</string></edit>
  </match>

  <!-- 冬青黑体 (Hiragino Sans GB) -> 微软雅黑 -->
  <match target="pattern">
    <test qual="any" name="family"><string>Hiragino Sans GB</string></test>
    <edit name="family" mode="assign" binding="same"><string>Microsoft YaHei</string></edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family"><string>冬青黑体简体中文</string></test>
    <edit name="family" mode="assign" binding="same"><string>Microsoft YaHei</string></edit>
  </match>

  <!-- ================= 2. 中文名称 -> 英文 PostScript 名称映射 ================= -->
  <!-- 宋体 / 新宋体 -->
  <match target="pattern">
    <test qual="any" name="family"><string>宋体</string></test>
    <edit name="family" mode="assign" binding="same"><string>SimSun</string></edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family"><string>新宋体</string></test>
    <edit name="family" mode="assign" binding="same"><string>NSimSun</string></edit>
  </match>

  <!-- 黑体 -->
  <match target="pattern">
    <test qual="any" name="family"><string>黑体</string></test>
    <edit name="family" mode="assign" binding="same"><string>SimHei</string></edit>
  </match>

  <!-- 微软雅黑 -->
  <match target="pattern">
    <test qual="any" name="family"><string>微软雅黑</string></test>
    <edit name="family" mode="assign" binding="same"><string>Microsoft YaHei</string></edit>
  </match>

  <!-- 楷体 / 楷体_GB2312 -->
  <match target="pattern">
    <test qual="any" name="family"><string>楷体</string></test>
    <edit name="family" mode="assign" binding="same"><string>KaiTi</string></edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family"><string>楷体_GB2312</string></test>
    <edit name="family" mode="assign" binding="same"><string>KaiTi</string></edit>
  </match>

  <!-- 仿宋 / 仿宋_GB2312 -->
  <match target="pattern">
    <test qual="any" name="family"><string>仿宋</string></test>
    <edit name="family" mode="assign" binding="same"><string>FangSong</string></edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family"><string>仿宋_GB2312</string></test>
    <edit name="family" mode="assign" binding="same"><string>FangSong</string></edit>
  </match>

  <!-- 等线 -->
  <match target="pattern">
    <test qual="any" name="family"><string>等线</string></test>
    <edit name="family" mode="assign" binding="same"><string>DengXian</string></edit>
  </match>

  <!-- 方正小标宋 (FZXBSJW / FZXiaoBiaoSong-B05S) -->
  <match target="pattern">
    <test qual="any" name="family"><string>方正小标宋简体</string></test>
    <edit name="family" mode="assign" binding="same"><string>FZXBSJW--GB1-0</string></edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family"><string>方正小标宋</string></test>
    <edit name="family" mode="assign" binding="same"><string>FZXBSJW--GB1-0</string></edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family"><string>FZXiaoBiaoSong-B05S</string></test>
    <edit name="family" mode="assign" binding="same"><string>FZXBSJW--GB1-0</string></edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family"><string>FZXBSJW</string></test>
    <edit name="family" mode="assign" binding="same"><string>FZXBSJW--GB1-0</string></edit>
  </match>

  <!-- 方正仿宋 (FZFSJW / FZFangSong-Z02S) -->
  <match target="pattern">
    <test qual="any" name="family"><string>方正仿宋简体</string></test>
    <edit name="family" mode="assign" binding="same"><string>FZFSJW--GB1-0</string></edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family"><string>方正仿宋</string></test>
    <edit name="family" mode="assign" binding="same"><string>FZFSJW--GB1-0</string></edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family"><string>FZFangSong-Z02S</string></test>
    <edit name="family" mode="assign" binding="same"><string>FZFSJW--GB1-0</string></edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family"><string>FZFSJW</string></test>
    <edit name="family" mode="assign" binding="same"><string>FZFSJW--GB1-0</string></edit>
  </match>

  <!-- ================= 3. 缺失 Windows 商业字体时的开源字体回退兜底 ================= -->
  <!-- 若系统中无 SimSun，回退至 思源宋体 / 文泉驿正黑 -->
  <match target="pattern">
    <test qual="any" name="family"><string>SimSun</string></test>
    <edit name="family" mode="append" binding="weak">
      <string>Noto Serif CJK SC</string>
      <string>WenQuanYi Zen Hei</string>
    </edit>
  </match>

  <!-- 若系统中无 Microsoft YaHei / SimHei / DengXian，回退至 思源黑体 / 文泉驿微米黑 -->
  <match target="pattern">
    <test qual="any" name="family"><string>Microsoft YaHei</string></test>
    <edit name="family" mode="append" binding="weak">
      <string>Noto Sans CJK SC</string>
      <string>WenQuanYi Micro Hei</string>
      <string>WenQuanYi Zen Hei</string>
    </edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family"><string>SimHei</string></test>
    <edit name="family" mode="append" binding="weak">
      <string>Noto Sans CJK SC</string>
      <string>WenQuanYi Micro Hei</string>
      <string>WenQuanYi Zen Hei</string>
    </edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family"><string>DengXian</string></test>
    <edit name="family" mode="append" binding="weak">
      <string>Noto Sans CJK SC</string>
      <string>WenQuanYi Micro Hei</string>
    </edit>
  </match>

  <!-- 若系统中无 KaiTi / FangSong，回退至 思源宋体 / 文泉驿正黑 -->
  <match target="pattern">
    <test qual="any" name="family"><string>KaiTi</string></test>
    <edit name="family" mode="append" binding="weak">
      <string>Noto Serif CJK SC</string>
      <string>WenQuanYi Zen Hei</string>
    </edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family"><string>FangSong</string></test>
    <edit name="family" mode="append" binding="weak">
      <string>Noto Serif CJK SC</string>
      <string>WenQuanYi Zen Hei</string>
    </edit>
  </match>

  <!-- ================= 4. 全局泛型 CJK 默认首选 ================= -->
  <match target="pattern">
    <test qual="any" name="family"><string>sans-serif</string></test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Noto Sans CJK SC</string>
      <string>WenQuanYi Zen Hei</string>
    </edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family"><string>serif</string></test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Noto Serif CJK SC</string>
      <string>WenQuanYi Zen Hei</string>
    </edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family"><string>monospace</string></test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Noto Sans Mono CJK SC</string>
      <string>WenQuanYi Micro Hei Mono</string>
    </edit>
  </match>
</fontconfig>

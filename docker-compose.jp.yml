name: aks-jp

services:
  aks-api:
    build: .
    container_name: aks-api-jp
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env.jp
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./config:/app/config:ro
    networks:
      - aks-jp-network

  aks-workers:
    build: .
    container_name: aks-workers-jp
    restart: unless-stopped
    env_file:
      - .env.jp
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./config:/app/config:ro
    command: ["uv", "run", "python", "scripts/start_all_workers.py"]
    networks:
      - aks-jp-network

networks:
  aks-jp-network:
    driver: bridge
